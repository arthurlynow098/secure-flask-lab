[project]
name = "secure-flask-lab"
version = "1.0.0"
description = "App Flask com defesas contra SQLi, XSS, IDOR e CSRF, cada uma coberta por teste"
requires-python = ">=3.10"
authors = [{ name = "Arthur Entsev" }]
license = { text = "MIT" }
dependencies = ["flask>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
